name: ppo

# PPO training schedule (tuned for drone racing based on Swift/MonoRace/SPIRAL papers)
train_every: 256  # race track avg gate spacing ~7.4m → ~74 steps at 10m/s; 256 ensures 3+ gate crossings per rollout
ppo_epochs: 10    # gradient epochs per update
num_minibatches: 16   # 512*256/16=8192 per minibatch — good gradient diversity
clip_param: 0.2
entropy_coef: 0.001   # actions are now clamped to [-1,1], so exploration is naturally bounded; 0.02 caused runaway entropy (5.7->41.4 in prev run)
gae_lambda: 0.95
gamma: 0.998  # long effective horizon (~500 steps) needed for lap bonus credit assignment
max_grad_norm: 5.0

adaptive_entropy:
  enabled: true
  phase0_coef_max: 0.005
  phase0_coef_min: 0.0005
  phase1_rebump_coef: 0.0045
  phase1_coef_min: 0.0003
  speed_ema_alpha: 0.05
  speed_signal_low: 0.05
  speed_signal_high: 0.60
  max_delta_per_update: 0.00025

# Privileged critic: during training the critic gets obs + intrinsics (mass, inertia, KF).
# This gives much more accurate value estimates → better GAE advantages → faster policy learning.
# The actor never sees intrinsics (it would have them at inference anyway since drone is fixed),
# so this is a pure training acceleration exploit with no inference cost.
priv_actor: true    # SIM-ONLY EXPLOIT: no real-world transfer needed, actor also sees mass/inertia/KF
priv_critic: true   # KEY SIM EXPLOIT: critic sees privileged physical parameters during training

actor:
  # 2-layer 256-unit network with LeakyReLU (slope 0.2) — Swift (Nature 2023) architecture.
  lr: 0.0003               # 3e-4 Adam — standard across Swift, MonoRace, SPIRAL
  hidden_units: [256, 256]
  activation: leaky_relu   # LeakyReLU(0.2) — avoids dead neurons vs ReLU
  lr_scheduler:
  lr_scheduler_kwargs:
  layer_norm: true
  weight_decay: 0.0

critic:
  # Wider critic: value estimation benefits from capacity since it sees obs + intrinsics.
  # Actor stays [256,256] to avoid overfitting on the compact 27-dim obs.
  lr: 0.0003
  hidden_units: [256, 256, 128]  # extra layer: critic has more signal (obs + intrinsics) to process
  activation: leaky_relu
  lr_scheduler:
  lr_scheduler_kwargs:
  layer_norm: true
  weight_decay: 0.0
  use_huber_loss: true   # Huber loss: more robust to outlier returns during early chaotic training
  huber_delta: 10.0

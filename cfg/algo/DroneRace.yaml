name: ppo

# PPO training schedule (tuned for drone racing based on Swift/MonoRace/SPIRAL papers)
train_every: 128  # gate-to-gate ~70 steps at 10m/s; 128 guarantees at least 1 gate crossing per rollout
ppo_epochs: 8     # gradient epochs per update
num_minibatches: 5
clip_param: 0.2
entropy_coef: 0.003   # low entropy encourages exploitation; drone racing converges quickly
gae_lambda: 0.95
gamma: 0.995  # longer effective horizon (200 steps) — better credit-assignment for lap bonus at step 300+
max_grad_norm: 5.0

# whether to use privileged information
priv_actor: false
priv_critic: false

checkpoint_path:

actor:
  # 2-layer 256-unit network with LeakyReLU (slope 0.2) — proven in Swift (Nature 2023).
  # Agile Flight 2025 used [512,512,256,128] ELU but Swift's 2x128 also champion-level.
  lr: 0.0003               # 3e-4 Adam — standard across Swift, MonoRace, SPIRAL
  hidden_units: [256, 256]
  activation: leaky_relu   # LeakyReLU(0.2) — Swift architecture; avoids dead neurons vs ReLU
  lr_scheduler:
  lr_scheduler_kwargs:
  layer_norm: true
  weight_decay: 0.0

critic:
  lr: 0.0003
  hidden_units: [256, 256]
  activation: leaky_relu
  lr_scheduler:
  lr_scheduler_kwargs:
  layer_norm: true
  weight_decay: 0.0
  use_huber_loss: false
  huber_delta: 10.0

name: ppo

train_every: 64
ppo_epochs: 6
num_minibatches: 16
clip_param: 0.2
entropy_coef: 0.002
gae_lambda: 0.97
gamma: 0.995
max_grad_norm: 5.0

# whether to use privileged information
priv_actor: false
priv_critic: false

# checkpoint_path: # seems to override CLI arg

actor:
  lr: 0.0001
  hidden_units: [2048, 2048, 1024, 1024, 512]
  activation: silu
  lr_scheduler:
  lr_scheduler_kwargs:
  layer_norm: true
  weight_decay: 0.0

critic:
  lr: 0.0001
  hidden_units: [2048, 2048, 1024, 1024, 512]
  activation: silu
  lr_scheduler:
  lr_scheduler_kwargs:
  layer_norm: true
  weight_decay: 0.0
  use_huber_loss: true
  huber_delta: 10.0

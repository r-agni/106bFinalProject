name: DroneRaceEnv

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_

# Viewer camera aimed at the center of the race track.
# Original track spans X: 6–24, Y: 6–34 → center ≈ (15, 20, 1.5).
viewer:
  resolution: [960, 720]
  eye: [15.0, -5.0, 35.0]
  lookat: [15.0, 20.0, 1.5]

# Task-specific PPO overrides. Points to a file in cfg/algo/ that is merged
# over the default ppo.yaml when this task is loaded.
ppo_cfg: DroneRace.yaml

env:
  num_envs: 512            # power-of-2 for minibatch alignment
  max_episode_length: 2000 # 20 seconds — race track is 3x longer; early policies need time to reach more gates

sim:
  substeps: 5   # overrides the default of 5
  dt: 0.002 
  
drone_model:
  name: Iris
  controller: RateController

total_frames: 800_000_000
save_interval: 100 
# seed: 0

# Track configuration: config-based track with custom gate positions and orientations
# Gate's local x axis is perpendicular to surface. Center is on the bottom middle. 
# IMPORTANT: The last gate should be the exact same pos and yaw as the first gate. 

# Circular track (disabled — using Race track below)
# track_config:
#   "1":
#     pos: [0.0, 0.0, 1.0]
#     yaw: 1.57
#   "2":
#     pos: [5.0, 5.0, 1.0]
#     yaw: 0
#   "3":
#     pos: [10.0, 0.0, 1.0]
#     yaw: -1.57
#   "4":
#     pos: [5.0, -5.0, 1.0]
#     yaw: 3.14  # pi
#   "5":
#     pos: [0.0, 0.0, 1.0]
#     yaw: 1.57

# Figure 8
# track_config:
#   "1":
#     pos: [0.0, 0.0, 1.0]
#     yaw: 1.57
#   "2":
#     pos: [2.0, 3.0, 1.0]
#     yaw: 0
#   "3":
#     pos: [10.0, -3.0, 1.0]
#     yaw: 0
#   "4":
#     pos: [12.0, 0.0, 1.0]
#     yaw: 1.57
#   "5":
#     pos: [10.0, 3.0, 1.0]
#     yaw: 3.14
#   "6":
#     pos: [2.0, -3.0, 1.0]
#     yaw: 3.14
#   "7":
#     pos: [0.0, 0.0, 1.0]
#     yaw: 1.57

# Race track — 13 gates (original EECS106B positions).
# Gate 13 = Gate 1 (lap closure). Elevated gates at 7 and 11 (z=3.0).
# Sharp turns at gates 5→6 and 7→8 (180° reversal).
track_config:
  "1":
    pos: [14.0, 34.0, 1.0]
    yaw: 0.0

  "2":
    pos: [20.0, 30.0, 1.0]
    yaw: -0.78

  "3":
    pos: [21.0, 22.0, 1.0]
    yaw: -1.049

  "4":
    pos: [24.0, 12.0, 1.0]
    yaw: -1.57

  "5":
    pos: [19.0, 6.0, 1.0]
    yaw: 2.97

  "6":
    pos: [14.0, 14.0, 1.0]
    yaw: 3.14

  "7":
    pos: [9.0, 6.0, 3.0]     # elevated gate — climb here
    yaw: 4.54

  "8":
    pos: [9.0, 6.0, 1.0]     # same XY as gate 7, drop back to z=1; 180° reversal
    yaw: 1.40

  "9":
    pos: [8.0, 14.0, 1.0]
    yaw: 1.74

  "10":
    pos: [6.0, 22.0, 1.0]
    yaw: 1.40

  "11":
    pos: [8.0, 30.0, 3.0]    # elevated gate — climb here
    yaw: 0.78

  "12":
    pos: [8.0, 30.0, 1.0]    # same XY as gate 11, drop back to z=1; yaw reversed 180° so crossing detection works
    yaw: 3.921               # = 0.78 + pi; must face OPPOSITE to gate 11 (same as gate 7/8 design)

  "13":
    pos: [14.0, 34.0, 1.0]   # lap closure = gate 1
    yaw: 0.0
    
# Gate settings
gate_scale: 1.0
gate_height: 1.5   # original gate design — do not change
gate_width: 1.5    # original gate design — do not change 

# ---- Reward hyperparameters (tuned for 13-gate race track) ----
# Retuned after run 2a8kkbon: gate reward was 0.01x of return (drowned by speed+progress). Target now: gate reward ≈ 40% of return at convergence.
reward_progress_scale: 3.0        # dense: path-projection progress along racing line (Song et al. 2021) — reduced from 5.0 so gate reward dominates
reward_velocity_scale: 0.0        # velocity toward gate — disabled (conflicts with corner-cutting)
reward_gate_passage: 50.0         # sparse bonus per gate crossed — 2.5x of previous 20.0 so gate crossings drive the gradient
reward_lap_completion: 100.0      # full lap bonus
reward_angular_penalty: 0.15      # penalize squared angular rates; 3x of previous 0.05 so tipping over actually costs; decays over 100M frames
reward_action_smooth_scale: 0.003 # penalize large action changes
reward_crash_scale: 80.0          # crash penalty — larger than sum of ~3 gate rewards to prevent crash-gaming (still >> 50 gate bonus)
reward_speed_scale: 0.1           # speed along racing line (clamped ≥0) — reduced from 0.3: was drowning the gate reward
reward_altitude_scale: 0.5        # bonus for matching altitude at elevated gates (origin z=3.0, center z=3.75m with gate_height=1.5); threshold fixed to > 2.75m so it only fires at gates 7 and 11
reward_approach_scale: 0.3        # bonus for reducing distance when within 4m of gate
crash_dist_threshold: 18.0        # max gate spacing is ~10.44m; 18m gives 7.6m recovery margin (0.76s at 10 m/s)
crash_z_min: 0.15                 # minimum altitude (ground crash)
# ---------------------------------------------------------------------------

# If gates are hard to see, set debug_gate_origins: true for thick RGB axes at each gate.
debug_gate_origins: false
debug_axis_length: 0.5
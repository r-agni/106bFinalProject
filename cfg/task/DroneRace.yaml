name: DroneRaceEnv

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_

# Viewer camera aimed at the center of the race track.
# Original track spans X: 6–24, Y: 6–34 → center ≈ (15, 20, 1.5).
viewer:
  resolution: [960, 720]
  eye: [15.0, -5.0, 35.0]
  lookat: [15.0, 20.0, 1.5]

# Task-specific PPO overrides. Points to a file in cfg/algo/ that is merged
# over the default ppo.yaml when this task is loaded.
ppo_cfg: DroneRace.yaml

env:
  num_envs: 512            # power-of-2 for minibatch alignment
  max_episode_length: 2000 # 20 seconds — race track is 3x longer; early policies need time to reach more gates

sim:
  substeps: 5   # overrides the default of 5
  dt: 0.002 
  
drone_model:
  name: Iris
  controller: RateController

total_frames: 800_000_000
save_interval: 100 
# seed: 0

# Track configuration: config-based track with custom gate positions and orientations
# Gate's local x axis is perpendicular to surface. Center is on the bottom middle. 
# IMPORTANT: The last gate should be the exact same pos and yaw as the first gate. 

# Circular track (disabled — using Race track below)
# track_config:
#   "1":
#     pos: [0.0, 0.0, 1.0]
#     yaw: 1.57
#   "2":
#     pos: [5.0, 5.0, 1.0]
#     yaw: 0
#   "3":
#     pos: [10.0, 0.0, 1.0]
#     yaw: -1.57
#   "4":
#     pos: [5.0, -5.0, 1.0]
#     yaw: 3.14  # pi
#   "5":
#     pos: [0.0, 0.0, 1.0]
#     yaw: 1.57

# Figure 8
# track_config:
#   "1":
#     pos: [0.0, 0.0, 1.0]
#     yaw: 1.57
#   "2":
#     pos: [2.0, 3.0, 1.0]
#     yaw: 0
#   "3":
#     pos: [10.0, -3.0, 1.0]
#     yaw: 0
#   "4":
#     pos: [12.0, 0.0, 1.0]
#     yaw: 1.57
#   "5":
#     pos: [10.0, 3.0, 1.0]
#     yaw: 3.14
#   "6":
#     pos: [2.0, -3.0, 1.0]
#     yaw: 3.14
#   "7":
#     pos: [0.0, 0.0, 1.0]
#     yaw: 1.57

# Race track — 13 gates (original EECS106B positions).
# Gate 13 = Gate 1 (lap closure). Elevated gates at 7 and 11 (z=3.0).
# Sharp turns at gates 5→6 and 7→8 (180° reversal).
track_config:
  "1":
    pos: [14.0, 34.0, 1.0]
    yaw: 0.0

  "2":
    pos: [20.0, 30.0, 1.0]
    yaw: -0.78

  "3":
    pos: [21.0, 22.0, 1.0]
    yaw: -1.049

  "4":
    pos: [24.0, 12.0, 1.0]
    yaw: -1.57

  "5":
    pos: [19.0, 6.0, 1.0]
    yaw: 2.97

  "6":
    pos: [14.0, 14.0, 1.0]
    yaw: 3.14

  "7":
    pos: [9.0, 6.0, 3.0]     # elevated gate — climb here
    yaw: 4.54

  "8":
    pos: [9.0, 6.0, 1.0]     # same XY as gate 7, drop back to z=1; 180° reversal
    yaw: 1.40

  "9":
    pos: [8.0, 14.0, 1.0]
    yaw: 1.74

  "10":
    pos: [6.0, 22.0, 1.0]
    yaw: 1.40

  "11":
    pos: [8.0, 30.0, 3.0]    # elevated gate — climb here
    yaw: 0.78

  "12":
    pos: [8.0, 30.0, 1.0]    # same XY as gate 11, drop back to z=1; yaw reversed 180° so crossing detection works
    yaw: 3.921               # = 0.78 + pi; must face OPPOSITE to gate 11 (same as gate 7/8 design)

  "13":
    pos: [14.0, 34.0, 1.0]   # lap closure = gate 1
    yaw: 0.0
    
# Gate settings
gate_scale: 1.0
gate_height: 1.5   # original gate design — do not change
gate_width: 1.5    # original gate design — do not change 

# ---- Reward hyperparameters (tuned for the 13-gate race track) ----
# Phase 0: learn the ordered lap with gate / sequence rewards plus light guidance.
# Phase 1: once lap completion accuracy is high enough, keep progress shaping and add lap-time pressure.

# Dense shaping along the racing line.
# Keep this small in phase 0 so the drone cannot earn most reward by flying past gates.
reward_progress_scale: 1.0        # path-projection progress between consecutive gates

# Sparse bonuses for correct ordered course completion.
reward_gate_passage: 60.0         # per-gate reward; crossing gates should dominate phase-0 learning
reward_gate_sequence_scale: 20.0  # stronger bonus for longer ordered gate streaks within the episode
reward_lap_completion: 500.0      # make finishing the full course the primary objective
reward_lap_speed_bonus: 300.0     # extra bonus scaled by episode time remaining; enabled only after unlock

# Auxiliary penalties for local mistakes.
reward_altitude_scale: 0.5        # bounded penalty for altitude mismatch at elevated gates 7 and 11
reward_approach_scale: 0.5        # penalty for moving away from the gate when already within 6m
reward_gate_centering_scale: 0.03 # bounded per-step penalty for missing the gate centerline near any gate

# Penalties and crash termination thresholds.
reward_angular_penalty: 0.1       # penalize squared angular rates
reward_action_smooth_scale: 0.002 # penalize large action changes
reward_crash_scale: 80.0          # crash penalty
crash_dist_threshold: 25.0        # terminate if the drone diverges too far from the target gate
crash_z_min: 0.15                 # terminate if the drone drops below this altitude

# Accuracy-first curriculum.
phase_speed_unlock_accuracy_rate: 0.40 # enable speed shaping once full-lap completion EMA reaches this rate
curriculum_min_phase_frames: 2_000_000 # minimum frames before the speed phase can unlock
curriculum_ema_alpha: 0.01             # EMA smoothing for curriculum metrics

# Safety / penalty schedule.
angular_penalty_decay_frames: 100_000_000 # keep angular damping active through the early learning stages
crash_grace_steps: 100                    # grace window after spawn / gate crossing before distance crash applies
# ---------------------------------------------------------------------------

# If gates are hard to see, set debug_gate_origins: true for thick RGB axes at each gate.
debug_gate_origins: false
debug_axis_length: 0.5

# Gate settings
gate_scale: 1.0
gate_height: 2.5 
gate_width: 2.5 

# ---- Reward hyperparameters (MonoRace/Swift/SPIRAL-inspired, 2025 SotA) ----
reward_progress_scale: 4.0        # dense: path-projection progress along racing line (Song et al. 2021)
reward_velocity_scale: 0.0        # velocity toward gate — disabled (conflicts with corner-cutting; not used in Swift/Song/Wang)
reward_gate_passage: 15.0         # sparse bonus per gate passed
reward_lap_completion: 50.0       # bonus for completing full lap
reward_angular_penalty: 0.03      # penalize squared angular rates (decays to 0 over 50M frames)
reward_action_smooth_scale: 0.03  # penalize large action changes
reward_crash_scale: 40.0          # terminal crash penalty — must dominate expected episode return (~40 dense reward over 100 steps)
crash_dist_threshold: 5.5         # ~0.8x gate spacing (7.07m) — kills off-track episodes quickly without being too tight
crash_z_min: 0.15                 # minimum altitude (ground crash)
# ---------------------------------------------------------------------------

debug_gate_origins: false
debug_axis_length: 0.5
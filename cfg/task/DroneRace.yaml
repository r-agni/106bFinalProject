# Race track — 13 YAML gate entries (original EECS106B positions).
# Race track
track_config:
  "1":
    pos: [12.5, 2.0, 1.0]
    yaw: 3.14

  "2":
    pos: [6.5, 6.0, 1.0]
    yaw: 2.36

  "3":
    pos: [5.5, 14.0, 1.0]
    yaw: 2.093

  "4":
    pos: [2.5, 24.0, 1.0]
    yaw: 1.57

  "5":
    pos: [7.5, 30.0, 1.0]
    yaw: 6.11

  "6":
    pos: [12.2, 22.0, 1.0]
    yaw: 6.28

  "7":
    pos: [17.5, 30.0, 3.0]
    yaw: 7.68

  "8":
    pos: [17.5, 30.0, 1.0]
    yaw: 4.54

  "9":
    pos: [18.0, 22.0, 1.0]
    yaw: 4.88

  "10":
    pos: [20.5, 14.0, 1.0]
    yaw: 4.54

  "11":
    pos: [18.5, 6.0, 3.0]
    yaw: 3.92

  "12":
    pos: [18.5, 6.0, 1.0]
    yaw: 3.92

  "13":
    pos: [12.5, 2.0, 1.0]
    yaw: 3.14
    
# Gate settings
gate_scale: 1.0
gate_height: 2.5
gate_width: 2.5

# ---- Reward hyperparameters (tuned for the 13-gate race track) ----
# Phase 0: learn the ordered lap with gate / sequence rewards plus light guidance.
# Phase 1: after speed shaping unlocks, add dense speed pressure while keeping sparse gate rewards dominant.

# Dense shaping along the racing line.
# Keep this small in phase 0 so the drone cannot earn most reward by flying past gates.
reward_progress_scale: 1.0        # path-projection progress between consecutive gates
reward_speed_scale: 0.25          # dense forward-speed reward after the first successful lap unlocks speed shaping
reward_speed_target_ms: 6.0       # cap dense speed shaping so it stays well below sparse gate rewards
reward_stacked_direction_scale: 2.0 # signed gate-frame progress shaping for the hard lower stacked-return gates
reward_stacked_entry_bonus: 8.0     # bonus when advancing from the elevated entry gate to the lower reversal gate
reward_stacked_clear_bonus: 30.0    # extra sparse bonus for actually clearing the lower reversal gate

# Sparse bonuses for correct ordered course completion.
reward_gate_passage: 60.0         # per-gate reward; crossing gates should dominate phase-0 learning
reward_gate_sequence_scale: 20.0  # stronger bonus for longer ordered gate streaks within the episode
reward_lap_completion: 530.0      # safely restore the old accidental lap-closure bonus without corrupting gate-11 bookkeeping
reward_lap_speed_bonus: 300.0     # extra bonus scaled by episode time remaining; enabled only after unlock

# Auxiliary penalties for local mistakes.
reward_altitude_scale: 0.5        # bounded penalty for altitude mismatch at elevated gates 7 and 11
reward_approach_scale: 0.5        # penalty for moving away from the gate when already within 6m
reward_gate_centering_scale: 0.03 # bounded per-step penalty for missing the gate centerline near any gate
reward_gate_reentry_scale: 35.0   # one-shot penalty when the drone backs back into the same monitored gate opening after crossing
reward_exit_anchor_scale: 6.0     # local post-gate reward that nudges the drone onto the next segment after monitored gates

# Penalties and crash termination thresholds.
reward_angular_penalty: 0.1       # penalize squared angular rates
reward_action_smooth_scale: 0.002 # penalize large action changes
reward_crash_scale: 80.0          # crash penalty
crash_dist_threshold: 25.0        # terminate if the drone diverges too far from the target gate
crash_z_min: 0.15                 # terminate if the drone drops below this altitude

# Accuracy-first curriculum.
phase_speed_unlock_on_first_success: false # keep speed shaping off until lap completion is reliable, not just lucky once
phase_speed_unlock_accuracy_rate: 0.40 # fallback EMA-based unlock when first-success unlock is disabled
phase1_unlock_gate_index: 5            # zero-based gate bottleneck that must be solved before speed shaping unlocks
phase1_unlock_gate_pass_rate: 0.70     # require reliable gate-5 passage from gate-0 starts before phase 1
phase2_speed_focus_accuracy_rate: 0.40 # once full laps are reliable, switch to a speed-focused phase with shaping removed
curriculum_min_phase_frames: 2_000_000 # minimum frames before the speed phase can unlock
curriculum_ema_alpha: 0.01             # EMA smoothing for curriculum metrics
reset_curriculum_enabled: true         # allocate some resets to the earliest unsolved gate bottleneck once gate-0-start passage drops below threshold
reset_curriculum_gate_pass_threshold: 0.90 # activate practice resets when the earliest gate-0-start passage EMA falls below this
reset_curriculum_gate0_prob: 0.40      # keep some full-lap pressure, but spend much more time near the weak gate
reset_curriculum_prev_gate_prob: 0.50  # focused practice starts from the gate immediately before the active weak gate
reset_curriculum_random_gate_prob: 0.10 # small amount of broad coverage from uniformly random real course gates
reset_curriculum_metric_alpha: 0.01    # EMA smoothing for gate-0-start per-gate passage reliability
hard_turn_target_gates: []             # no gate-specific hard-turn shaping in the original-track scratch baseline
wrong_side_penalty_target_gates: []    # disable previous-track wrong-side targeting for the original-track scratch baseline
reward_hard_turn_direction_scale: 0.0  # disable gate-5/6-specific corridor shaping for the original-track scratch baseline
reward_hard_turn_clear_bonus: 0.0      # disable gate-5/6-specific sparse bonus for the original-track scratch baseline
hard_turn_corridor_x_min: -10.0        # start guiding the drone earlier on the gate-5 approach
hard_turn_corridor_x_max: 4.0
hard_turn_corridor_halfwidth: 4.5      # allow a wide turning arc before centering penalties fully apply
hard_turn_corridor_height: 3.0
reward_hard_turn_wrong_side_scale: 0.0 # disable previous-track wrong-side shaping for the original-track scratch baseline
hard_turn_wrong_side_x_min: 0.25       # ignore tiny post-plane jitter; focus on real backside approaches
hard_turn_wrong_side_x_max: 3.0        # only punish the local gate neighborhood, not the far downstream path
wrong_side_violation_ends_episode: false # keep wrong-side termination off until this track's bottlenecks are re-measured
hard_turn_penalty_scale: 1.0           # restore default near-gate penalties for the original-track scratch baseline
gate_reentry_target_gates: [4, 5, 11] # zero-based gates G5, G6, G12; monitor these for post-cross backing through the same opening
gate_reentry_monitor_substeps: 200     # keep watching the crossed gate for ~0.4 s after scoring it
gate_reentry_clearance_x: 0.05         # require a small forward commit before a later negative-x sample counts as a re-entry
gate_reentry_backtrack_x: -0.05        # backing back through the monitored gate opening beyond this plane triggers the penalty
exit_anchor_target_gates: [4, 5, 11]   # zero-based gates that get a short-lived downstream exit anchor reward
exit_anchor_distance: 1.5              # meters downstream of the crossed gate along the next-gate segment
exit_anchor_radius: 0.6                # once the drone gets this close to the exit anchor, the local reward turns off
exit_anchor_max_steps: 30              # keep the exit anchor alive for ~0.3 s after the monitored gate crossing
sparse_only_gate_indices: [6, 7, 10, 11] # zero-based target gates in the stacked sections; dense shaping is disabled here
sparse_disable_smoothness_penalties: true # allow harsher maneuvers inside sparse-only stacked-gate sections
reward_speed_scale_phase2: 0.75        # stronger dense speed reward once reliable full laps are achieved
reward_speed_target_ms_phase2: 8.0     # higher speed target for the final speed-focused phase
phase2_disable_dense_shaping: true     # turn off dense shaping / penalty helpers in the final speed phase
phase2_disable_wrong_side_penalty: false # keep the wrong-side gate-entry penalty on during the final speed phase
stacked_reversal_entry_gates: [6, 10]     # elevated stacked gates that transition into the hard lower reversal gates
stacked_reversal_target_gates: [7, 11]    # lower stacked gates that need extra local credit assignment
stacked_reversal_dist_threshold: 35.0     # allow wider divergence while recovering through the stacked reversal
stacked_reversal_grace_steps: 220         # suppress distance-crash briefly after entering the stacked reversal window

# Constrained speed-mode controller.
controller_completion_target: 0.78
controller_completion_floor: 0.70
controller_completion_recover: 0.60
controller_hard_gate_target: 0.82
controller_final_gate_target: 0.78
controller_crash_target: 0.40
controller_crash_recover: 0.60
controller_speed_up_step: 0.015
controller_speed_down_step: 0.08
controller_speed_panic_step: 0.20
controller_plateau_windows: 8
controller_plateau_improvement_eps: 0.01
controller_success_min_for_t20: 32
controller_explore_episode_rate_max: 0.5
controller_easy_gate_jitter_lo: -0.05
controller_easy_gate_jitter_hi: 0.15
controller_hard_gate_indices: [6, 7, 10, 11]
controller_final_gate_indices: [10, 11]
controller_metric_alpha: 0.08              # speed-controller EMA/window smoothing; much faster than the curriculum EMA
controller_metric_window: 8                # number of recent controller windows used for speed decisions
controller_stabilize_completion_target: 0.75 # unlock speed mode earlier once gate-0 full-lap completion is solid
controller_stabilize_hard_gate_target: 0.75  # allow hard-gate stability to trigger speed mode sooner
controller_stabilize_final_gate_target: 0.75 # allow late-gate stability to trigger speed mode sooner
controller_stabilize_crash_target: 0.20      # phase-1 unlock requires low crash rate, not just high completion
controller_phase2_completion_target: 0.84    # once unlocked, keep pushing speed as long as completion stays comfortably high
controller_phase2_hard_gate_target: 0.86     # preserve stacked-gate quality while minimizing lap time
controller_phase2_final_gate_target: 0.84    # preserve late-gate quality while minimizing lap time
controller_phase2_completion_floor: 0.76     # drop below this and immediately back off speed pressure
controller_phase2_final_gate_floor: 0.78     # late gates are the first collapse signal during high-speed training
controller_phase2_crash_target: 0.18         # acceptable crash rate while aggressively searching for faster lines
controller_phase2_crash_recover: 0.28        # panic threshold for high-speed collapse recovery
controller_phase1_initial_speed_pressure: 0.10 # mild speed pressure as soon as the course is learned
controller_phase2_initial_speed_pressure: 0.35 # start phase 2 already moving faster instead of ramping from zero
controller_phase2_speed_up_step: 0.03          # accelerate speed pressure more aggressively in lap-time mode
controller_phase2_speed_down_step: 0.06        # back off if completion / late-gate quality slips
controller_phase2_panic_step: 0.18             # hard rollback when high-speed behavior destabilizes
controller_phase2_plateau_start_pressure: 0.45 # only start structured line-search once speed pressure is meaningfully high
controller_completion_drop_recover: 0.10       # detect real performance collapses quickly from recent history
controller_min_phase_frames: 0                 # no extra dwell once the 90%+ stability window is satisfied; unlock speed mode quickly on strong resumes
speed_budget_a_lat_conservative: 4.5
speed_budget_a_lat_aggressive: 8.0
speed_budget_vertical_discount: 0.90
speed_budget_entry_discount: 0.92
speed_budget_target_discount: 0.85
speed_budget_v_min: 3.5
speed_budget_v_max: 12.0

# Safety / penalty schedule.
angular_penalty_decay_frames: 100_000_000 # keep angular damping active through the early learning stages
crash_grace_steps: 100                    # grace window after spawn / gate crossing before distance crash applies
# ---------------------------------------------------------------------------

# If gates are hard to see, set debug_gate_origins: true for thick RGB axes at each gate.
debug_gate_origins: false
debug_axis_length: 0.5

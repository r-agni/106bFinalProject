name: DroneRaceEnv

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_

# Viewer camera aimed at the center of the race track.
# Original track spans X: 6–24, Y: 6–34 → center ≈ (15, 20, 1.5).
viewer:
  resolution: [960, 720]
  eye: [15.0, -5.0, 35.0]
  lookat: [15.0, 20.0, 1.5]

# Task-specific PPO overrides. Points to a file in cfg/algo/ that is merged
# over the default ppo.yaml when this task is loaded.
ppo_cfg: DroneRace.yaml

env:
  num_envs: 512            # power-of-2 for minibatch alignment
  max_episode_length: 2000 # 20 seconds — race track is 3x longer; early policies need time to reach more gates

sim:
  substeps: 5   # overrides the default of 5
  dt: 0.002 
  
drone_model:
  name: Iris
  controller: RateController

total_frames: 800_000_000
save_interval: 10  # keep resumes from going too long between checkpoints
# seed: 0

# Track configuration: config-based track with custom gate positions and orientations
# Gate's local x axis is perpendicular to surface. Center is on the bottom middle. 
# IMPORTANT: Gate 13 should be the exact same pos and yaw as gate 1.
# It is the finish line, and a full lap is only completed after the drone
# legally crosses this final gate.

# Circular track (disabled — using Race track below)

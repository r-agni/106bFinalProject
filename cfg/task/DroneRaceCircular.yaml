name: DroneRaceEnv

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_

env:
  num_envs: 512
  max_episode_length: 3000

drone_model:
  name: Hummingbird
  controller: LeePositionController

# Circular track configuration (used when track_config is not provided)
num_gates: 6
track_radius: 5.0
gate_spacing: 3.0
gate_height: 2.0

# Gate settings
gate_scale: 1.0
pass_threshold: 0.4

# Reward settings
reward_progress_scale: 2.0
reward_gate_passage: 10.0
reward_gate_sequence_scale: 2.0
reward_lap_completion: 25.0
reward_lap_speed_bonus: 25.0
reward_angular_penalty: 0.1
reward_action_smooth_scale: 0.002
reward_crash_scale: 20.0
reward_altitude_scale: 0.0
reward_approach_scale: 0.2
reward_off_path_scale: 0.0
crash_dist_threshold: 12.0
crash_z_min: 0.15
phase_speed_unlock_accuracy_rate: 0.40
curriculum_min_phase_frames: 500_000
curriculum_ema_alpha: 0.01
angular_penalty_decay_frames: 20_000_000
crash_grace_steps: 100
reward_effort_weight: 0.1
reward_final_position: 10.0

# Observation settings
time_encoding: true

# Episode settings
reset_on_collision: false

action_transform: null

# Debug visualization
debug_gate_origins: true
debug_axis_length: 0.3  # Optional: adjust axis line length

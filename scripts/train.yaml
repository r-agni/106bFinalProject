# hydra.job.chdir: false
hydra:
  searchpath:
    # see https://hydra.cc/docs/advanced/search_path/
    - file://../cfg
  run:
    # Relative to cwd (works on Windows and Linux; avoids hard-coded /workspace paths)
    dir: .hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

headless: true

sim: ${task.sim}
env: ${task.env}

total_frames: ${oc.select:task.total_frames,1000}
max_iters: -1
eval_interval: -1
save_interval: ${oc.select:task.save_interval,100}
seed: 0

auto_stop:
  enabled: false
  stop_on_first_success: false
  min_frames: 0
  lap_completion_rate:
  gates_passed_per_ep:
  mean_speed_ms:
  min_gate_cross_rate:
  window: 30

viewer:
  resolution: ${oc.select:task.viewer.resolution,[960,720]}
  eye: ${oc.select:task.viewer.eye,[8,0.,6.]}
  lookat: ${oc.select:task.viewer.lookat,[0.,0.,1.]}

wandb:
  group: ${oc.select:..task.name}
  run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}
  job_type: train
  entity:
  project: omnidrones
  mode: online # set to 'disabled' when debugging locally
  run_id:
  monitor_gym: True
  tags:

# play.py: ExplorationType name (MODE = deterministic-ish mean action; RANDOM = noisy sampling)
play_exploration: MODE

# play.py only: saves MP4 after rollout (sets headless=false and sim.enable_replicator)
record_video: false
video_path: hover_playback.mp4
record_video_max_steps: 800
video_frame_interval: 2
video_fps: 30

defaults:
  - task: Hover
  - algo: ppo
  - _self_
